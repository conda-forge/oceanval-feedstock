{% set version = "0.7.0" %}

package:
  name: oceanval
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/oceanval/oceanval-{{ version }}.tar.gz
  sha256: 0c4a50c6cbaff59e4e52cd659ed65e5ccafc46ba1e81b505b525523d8ab201e5


build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm
    - setuptools-git
    - setuptools
  run:
    - python >={{ python_min }}
    - dill
    - multiprocess
    - weasyprint
    - ncplot >=0.4.1
    - fiona
    - h5py
    - jupyter-book  >=2.0.0
    - jupytext
    - python-docx
    - pandoc
    - pint
    - plotnine
    - nctoolkit  >=1.3.11
    - matplotlib-base  <=3.10.9
    - notebook
    - nodejs  =22.23.2
    - ipykernel
    - rpy2
    - r-base
    - r-rcpp
    - r-cowplot
    - r-ggthemes
    - r-maps
    - r-plotrix
    - r-tidyverse
    - r-ggtext

test:
  imports:
    - oceanval
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://plymouthmarinelaboratory.github.io/OceanVal/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Automated ocean model analysis and validation in Python.

extra:
  recipe-maintainers:
    - robertjwilson
